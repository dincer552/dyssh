name: DYSSH Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Validation receives read-only repository access. Only the main-only release job
# receives the OIDC capability and release write permission.
permissions:
  contents: read

concurrency:
  group: dyssh-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION_CODE: ${{ github.run_number }}
  APP_VERSION_NAME: 1.0.${{ github.run_number }}
  APK_SIGNING_SERVICE_URL: https://signer.dinceryuksek.com

jobs:
  validate:
    name: Build and validate DYSSH
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;26.1.10909125"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y git patch make binutils unzip

      - name: Build cloudflared for Android ARM64
        env:
          GOPROXY: "https://proxy.golang.org,direct"
        run: |
          set -euo pipefail
          chmod +x scripts/build-cloudflared-android.sh
          scripts/build-cloudflared-android.sh

      - name: Build SSH terminal bridge for Android ARM64
        run: |
          set -euo pipefail
          mkdir -p src/main/jniLibs/arm64-v8a
          NDK="$ANDROID_HOME/ndk/26.1.10909125"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -O2 -Wall -Wextra -fPIE -pie -Wl,-z,max-page-size=16384 \
            src/main/cpp/sshbridge.c -o src/main/jniLibs/arm64-v8a/libsshbridge.so
          chmod 755 src/main/jniLibs/arm64-v8a/libsshbridge.so
          file src/main/jniLibs/arm64-v8a/libsshbridge.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests and build debug/release validation APKs
        run: |
          set -euo pipefail
          gradle --no-daemon \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME" \
            testDebugUnitTest assembleDebug assembleRelease

      - name: Verify package identity, native payload and 16 KB ELF alignment
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name 'dyssh.apk' -print -quit)"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$DEBUG_APK" \
            | grep -F "package: name='com.dincer552.dyssh.debug' versionCode='$APP_VERSION_CODE'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RELEASE_APK" \
            | grep -F "package: name='com.dincer552.dyssh' versionCode='$APP_VERSION_CODE'"

          for LIB in libcloudflared.so libsshbridge.so; do
            NATIVE_FILE="$RUNNER_TEMP/$LIB"
            unzip -p "$RELEASE_APK" "lib/arm64-v8a/$LIB" > "$NATIVE_FILE"
            test -s "$NATIVE_FILE"
            file "$NATIVE_FILE"
            readelf -h "$NATIVE_FILE" | grep -q 'AArch64'
            readelf -lW "$NATIVE_FILE" > "$NATIVE_FILE.program-headers"
            python3 - "$NATIVE_FILE.program-headers" "$LIB" <<'PY'
          import re, sys
          path, name = sys.argv[1:3]
          text = open(path, encoding="utf-8").read()
          aligns = []
          for line in text.splitlines():
              if re.match(r"^\s*LOAD\s", line):
                  match = re.search(r"(0x[0-9a-fA-F]+)\s*$", line)
                  if match:
                      aligns.append(int(match.group(1), 16))
          if not aligns:
              raise SystemExit(f"No PT_LOAD alignment values found for {name}")
          bad = [value for value in aligns if value < 0x4000]
          if bad:
              raise SystemExit(f"{name} has PT_LOAD alignment below 16 KB: {bad}")
          print(f"{name}: PT_LOAD alignment is 16 KB compatible ({aligns})")
          PY
          done

          mkdir -p dist
          cp "$RELEASE_APK" dist/dyssh-unsigned.apk
          echo "DYSSH debug/release package IDs, ARM64 native payload and 16 KB ELF alignment verified."

      - name: Upload debug APK for manual device testing
        uses: actions/upload-artifact@v4
        with:
          name: dyssh-debug-apk-${{ env.APP_VERSION_NAME }}
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK for main-only signer job
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: dyssh-release-validation-${{ env.APP_VERSION_NAME }}
          path: dist/dyssh-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Centrally sign and publish DYSSH
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download validated unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: dyssh-release-validation-${{ env.APP_VERSION_NAME }}
          path: ${{ runner.temp }}/release-validation

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Validate central signing endpoint
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="${APK_SIGNING_SERVICE_URL%/}/health"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "$HEALTH_URL" -o "$RUNNER_TEMP/signer-health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/signer-health.json"
          grep -q '"oidc":true' "$RUNNER_TEMP/signer-health.json"

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=socialworst-apk-signer")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Register DYSSH repository with the existing signer profile
        env:
          SIGNING_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          SIGNER_URL="${APK_SIGNING_SERVICE_URL%/}"
          HTTP_CODE="$(curl --silent --show-error --max-time 60 \\
            -X POST "$SIGNER_URL/v1/bootstrap" \\
            -H "Authorization: Bearer $SIGNING_OIDC_TOKEN" \\
            -F "key_id=dyssh" \\
            -F "package_name=com.dincer552.dyssh" \\
            -o "$RUNNER_TEMP/dyssh-bootstrap-response.json" \\
            -w "%{http_code}")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::DYSSH signer profile bootstrap/authorization failed (HTTP $HTTP_CODE). Response detail:"
            cat "$RUNNER_TEMP/dyssh-bootstrap-response.json"
            echo
            echo "The server must already contain the original dyssh JKS profile bound to dincer552/dyssh and com.dincer552.dyssh. No key is created or rotated by this workflow."
            exit 1
          fi
          cat "$RUNNER_TEMP/dyssh-bootstrap-response.json"

      - name: Sign with the existing DYSSH key (no key creation or rotation)
        env:
          SIGNING_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_APK="$RUNNER_TEMP/release-validation/dyssh-unsigned.apk"
          test -s "$UNSIGNED_APK"
          SIGNER_URL="${APK_SIGNING_SERVICE_URL%/}"
          HTTP_CODE="$(curl --silent --show-error --max-time 180 \
            -X POST "$SIGNER_URL/v1/sign" \
            -H "Authorization: Bearer $SIGNING_OIDC_TOKEN" \
            -F "key_id=dyssh" \
            -F "apk=@$UNSIGNED_APK;type=application/vnd.android.package-archive" \
            -o "$RUNNER_TEMP/dyssh-sign-response.bin" \
            -w "%{http_code}")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Central signer rejected DYSSH (HTTP $HTTP_CODE). Response detail:"
            cat "$RUNNER_TEMP/dyssh-sign-response.bin"
            echo
            echo "Do not create or rotate a key. Check the existing dyssh profile's repository binding and package name."
            exit 1
          fi
          test -s "$RUNNER_TEMP/dyssh-sign-response.bin"
          mv "$RUNNER_TEMP/dyssh-sign-response.bin" "$RUNNER_TEMP/dyssh-signed.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/dyssh-signed.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/dyssh-signed.apk" \
            | grep -F "package: name='com.dincer552.dyssh' versionCode='$APP_VERSION_CODE'"
          mkdir -p dist
          cp "$RUNNER_TEMP/dyssh-signed.apk" dist/dyssh.apk
          echo "DYSSH_SIGNED_APK=dist/dyssh.apk" >> "$GITHUB_ENV"

      - name: Verify signing certificate continuity
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/dyssh.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          test -n "$CURRENT_CERT"
          LATEST_JSON="$RUNNER_TEMP/dyssh-latest-release.json"
          PREVIOUS_STATUS="$(curl --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: DYSSH-Android-CI' \
            https://api.github.com/repos/dincer552/dyssh/releases/latest \
            -o "$LATEST_JSON" -w '%{http_code}' || true)"
          PREVIOUS_ASSET="$(python3 - "$LATEST_JSON" "$PREVIOUS_STATUS" <<'PY'
          import json, sys
          path, status = sys.argv[1:3]
          if status != "200":
              print("")
              raise SystemExit(0)
          try:
              release = json.load(open(path, encoding="utf-8"))
              asset = next((a for a in release.get("assets", []) if a.get("name") == "dyssh.apk"), None)
              print(asset.get("browser_download_url", "") if asset else "")
          except Exception:
              print("")
          PY
          )"
          if [ -n "$PREVIOUS_ASSET" ]; then
            curl --fail --silent --show-error --location "$PREVIOUS_ASSET" -o "$RUNNER_TEMP/dyssh-previous.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RUNNER_TEMP/dyssh-previous.apk"
            PREVIOUS_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/dyssh-previous.apk" \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
            if [ "$CURRENT_CERT" != "$PREVIOUS_CERT" ]; then
              echo "::error::DYSSH signing certificate changed; refusing to publish an incompatible update."
              exit 1
            fi
            echo "DYSSH signing certificate matches the previous release: $CURRENT_CERT"
          else
            echo "First DYSSH release certificate baseline: $CURRENT_CERT"
          fi
          echo "DYSSH signing certificate SHA-256: $CURRENT_CERT" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish signed DYSSH Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: DYSSH v${{ env.APP_VERSION_NAME }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: dist/dyssh.apk
          fail_on_unmatched_files: true

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyssh-signed-apk-${{ env.APP_VERSION_NAME }}
          path: dist/dyssh.apk
          if-no-files-found: error
          retention-days: 90
