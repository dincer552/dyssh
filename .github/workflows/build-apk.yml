name: DYSSH Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: dyssh-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, centrally sign and publish DYSSH
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
      APK_SIGNING_SERVICE_URL: ${{ vars.APK_SIGNING_SERVICE_URL || secrets.APK_SIGNING_SERVICE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;26.1.10909125"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y git patch make

      - name: Build cloudflared for Android ARM64
        env:
          GOPROXY: "https://proxy.golang.org,direct"
        run: |
          chmod +x scripts/build-cloudflared-android.sh
          scripts/build-cloudflared-android.sh

      - name: Build SSH terminal bridge for Android ARM64
        run: |
          mkdir -p src/main/jniLibs/arm64-v8a
          NDK="$ANDROID_HOME/ndk/26.1.10909125"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -O2 -Wall -Wextra -fPIE -pie -Wl,-z,max-page-size=16384 src/main/cpp/sshbridge.c -o src/main/jniLibs/arm64-v8a/libsshbridge.so
          chmod 755 src/main/jniLibs/arm64-v8a/libsshbridge.so
          file src/main/jniLibs/arm64-v8a/libsshbridge.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" testDebugUnitTest

      - name: Build unsigned release APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" assembleRelease
          APK="$(find build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: Validate central signing endpoint
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APK_SIGNING_SERVICE_URL" ]; then
            echo "::error::Set repository Actions variable APK_SIGNING_SERVICE_URL to the central signer HTTPS URL."
            exit 1
          fi
          HEALTH_URL="${APK_SIGNING_SERVICE_URL%/}/health"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$HEALTH_URL" -o "$RUNNER_TEMP/signer-health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/signer-health.json"
          grep -q '"oidc":true' "$RUNNER_TEMP/signer-health.json"

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        if: env.UNSIGNED_APK != ''
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=socialworst-apk-signer")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Sign DYSSH APK with central signer
        if: steps.oidc.outcome == 'success'
        env:
          SIGNING_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          SIGNER_URL="${APK_SIGNING_SERVICE_URL%/}"
          curl --fail-with-body --silent --show-error \
            -X POST "$SIGNER_URL/v1/sign" \
            -H "Authorization: Bearer $SIGNING_OIDC_TOKEN" \
            -F "key_id=dyssh" \
            -F "apk=@$UNSIGNED_APK;type=application/vnd.android.package-archive" \
            -o "$RUNNER_TEMP/dyssh-signed.apk"
          test -s "$RUNNER_TEMP/dyssh-signed.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/dyssh-signed.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/dyssh-signed.apk" | grep -F "package: name='com.dincer552.dyssh' versionCode='$APP_VERSION_CODE'"
          mkdir -p build/outputs/apk/release
          cp "$RUNNER_TEMP/dyssh-signed.apk" build/outputs/apk/release/dyssh.apk
          echo "RELEASE_APK=build/outputs/apk/release/dyssh.apk" >> "$GITHUB_ENV"

      - name: Publish signed DYSSH Release
        if: env.RELEASE_APK != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: DYSSH v${{ env.APP_VERSION_NAME }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: |
            build/outputs/apk/release/dyssh.apk
          fail_on_unmatched_files: true

      - name: Upload signed APK artifact
        if: env.RELEASE_APK != ''
        uses: actions/upload-artifact@v4
        with:
          name: dyssh-signed-apk-${{ env.APP_VERSION_NAME }}
          path: build/outputs/apk/release/dyssh.apk
          if-no-files-found: error
          retention-days: 90
